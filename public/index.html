<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sprite Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #16161e; color: #cdd6f4; display: flex; height: 100vh; }
  #sidebar { width: 200px; border-right: 1px solid #313244; padding: 12px; overflow-y: auto; flex-shrink: 0; }
  #sidebar h1 { font-size: 16px; margin: 0 0 12px; }
  .sprite-item { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .sprite-item.active, .sprite-item:hover { background: #313244; }
  #main { flex: 1; display: flex; flex-direction: column; padding: 10px 16px; gap: 10px; overflow-y: auto; min-width: 0; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row .sep { width: 1px; height: 22px; background: #313244; margin: 0 4px; }
  #canvas-wrap { align-self: center; background: repeating-conic-gradient(#45475a 0% 25%, #585b70 0% 50%) 0 0/16px 16px; line-height: 0; }
  canvas { image-rendering: pixelated; cursor: crosshair; }
  button, select, input[type="number"] { background: #313244; color: #cdd6f4; border: 1px solid #45475a; border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; }
  input[type="number"] { width: 56px; cursor: text; }
  button:hover { background: #45475a; }
  button.active { border-color: #89b4fa; background: #45475a; }
  button:disabled { opacity: 0.4; cursor: default; }
  #palette { display: flex; flex-wrap: wrap; gap: 4px; max-width: 640px; }
  .swatch { width: 26px; height: 26px; border-radius: 4px; border: 2px solid #313244; cursor: pointer; position: relative; }
  .swatch.active { border-color: #f9e2af; }
  .swatch.transparent { background: repeating-conic-gradient(#45475a 0% 25%, #585b70 0% 50%) 0 0/8px 8px !important; }
  .swatch span { position: absolute; bottom: -3px; right: 0; font-size: 9px; color: #a6adc8; text-shadow: 0 0 2px #000; }
  #filmstrip { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 0; }
  .frame-cell { display: flex; flex-direction: column; align-items: center; border: 2px solid #313244; border-radius: 6px; padding: 2px; cursor: pointer; line-height: 1; }
  .frame-cell.active { border-color: #a6e3a1; }
  .frame-cell canvas { cursor: grab; }
  .frame-cell span { font-size: 10px; color: #a6adc8; padding: 2px 0; }
  .frame-ops { display: flex; gap: 6px; align-items: center; color: #a6adc8; font-size: 12px; }
  #status { color: #a6adc8; font-size: 12px; min-height: 16px; }
  #status .err { color: #f38ba8; }
  #export-result { font-size: 12px; color: #a6e3a1; white-space: pre-wrap; max-width: 640px; }
  kbd { background: #313244; border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="sidebar"><h1>Sprite Studio</h1><div id="sprites"></div></div>
<div id="main">
  <div class="row" id="toolbar">
    <button data-tool="pencil" title="pencil (B)">✏️</button>
    <button data-tool="eraser" title="eraser (E)">🧽</button>
    <button data-tool="eyedropper" title="eyedropper (I) — right-click also picks">💧</button>
    <button data-tool="fill" title="flood fill (G)">🪣</button>
    <button data-tool="line" title="line (L)">📏</button>
    <button data-tool="rect" title="rect (R)">⬜</button>
    <button data-tool="replace" title="replace clicked color with selected color">🎨⇄</button>
    <span class="sep"></span>
    <button id="undo-btn" title="undo (Z)">↩</button>
    <button id="redo-btn" title="redo (shift+Z)">↪</button>
    <span class="sep"></span>
    <button id="zoom-out" title="zoom out">−</button>
    <span id="zoom-label">fit</span>
    <button id="zoom-in" title="zoom in">+</button>
    <button id="zoom-fit" title="fit">fit</button>
    <label><input type="checkbox" id="grid-toggle" /> grid</label>
    <label><input type="checkbox" id="onion-toggle" /> onion</label>
  </div>
  <div class="row">
    <select id="anim-select"><option value="">base sprite</option></select>
    <button id="play-btn">▶ play</button>
    <span class="sep"></span>
    <button id="export-btn">export</button>
  </div>
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="filmstrip"></div>
  <div id="palette"></div>
  <div id="status"></div>
  <div id="export-result"></div>
</div>
<input type="color" id="color-picker" style="position:absolute;visibility:hidden" />
<script type="module" src="/js/app.js"></script>
</body>
</html>
